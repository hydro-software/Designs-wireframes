<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Revenus — Naia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body data-page="revenue" data-section="revenue" data-centrale="all">

<div class="app-shell">
  <aside class="sidebar"></aside>
  <main class="main-area">

    <!-- v5: same layout as Production — breadcrumbs + time pills, no top title block. -->
    <header class="topbar" style="align-items:center">
      <div class="crumbs">
        <a href="index.html"><i data-lucide="home" style="width:12px; height:12px"></i></a>
        <span class="sep">/</span>
        <a href="index.html">Pilotage</a>
        <span class="sep">/</span>
        <span class="current">Revenus</span>
      </div>

      <div class="time-pills" role="tablist" aria-label="Granularité temporelle">
        <button class="on" onclick="setTimePill(this, 'intraday')">Intraday <span class="pill-dot" title="Événements WhatsApp"></span></button>
        <button onclick="setTimePill(this, '30j')">30 jours <span class="pill-dot"></span></button>
        <button onclick="setTimePill(this, '12m')">12 mois <span class="pill-dot"></span></button>
        <button onclick="setTimePill(this, 'annees')">Années <span class="pill-dot"></span></button>
      </div>
    </header>

    <div id="centrale-tabs" class="centrale-tabs"></div>

    <div class="page-content">

      <!-- v5: KPI tiles removed. Only the chart remains. -->

      <div class="card v2-banner" style="margin-bottom:14px">
        <i data-lucide="rocket"></i>
        <div><b>V2 :</b> module de simulation Valorise (BTM, batterie, digital twin) — visible dans le mockup pour validation, non livré en V1.</div>
      </div>

      <!-- Chart card — same toolbar structure as Production (v5 polish round 2): expandable
           Légende on the left, discrete icons on the right, floating right-axis toggle. -->
      <div class="card" style="margin-bottom:14px">
        <div class="card-head" style="border-bottom:1px solid var(--border-subtle)">

          <div class="legende" id="legende" data-open="false">
            <button class="legende-head" onclick="toggleLegende()" aria-expanded="false">
              <i data-lucide="chevron-down" class="legende-chev"></i>
              <span>Légende</span>
              <span class="legende-count" id="legende-count">3 indicateurs</span>
            </button>
            <div class="legende-body" id="legende-body"></div>
          </div>

          <div style="display:flex; gap:4px">
            <button class="icon-action" title="Configurer ce graphique" onclick="alert('Config par utilisateur — voir Production pour le wireframe complet')"><i data-lucide="sliders-horizontal"></i></button>
            <button class="icon-action" title="Exporter" onclick="alert('Export (démo)')"><i data-lucide="download"></i></button>
          </div>
        </div>

        <div style="position:relative; height:480px; padding:14px">
          <button class="right-axis-toggle" id="right-axis-toggle" onclick="toggleRightAxis()" title="Basculer l'axe droit entre Prix spot et Débit">
            <span id="right-axis-label">Prix spot (€/MWh)</span>
            <i data-lucide="arrow-left-right"></i>
          </button>
          <div class="chart-container" style="height:100%"><canvas id="production-chart"></canvas></div>
        </div>
      </div>

      <!-- v5: per-centrale breakdown table removed — same rule as Production (centrale info is in the tabs). -->

    </div>
  </main>
</div>

<script src="https://unpkg.com/lucide@latest"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="js/app.js"></script>

<script>
  function setTimePill(btn, pill) {
    document.querySelectorAll(".time-pills button").forEach(b => b.classList.remove("on"));
    btn.classList.add("on");
  }
  // Légende (expandable) — same shape as production.html.
  const LEGENDE_SLOTS = [
    { key: "comparateur", label: "Comparateur",   active: 0, options: [
      { name: "Revenus N-1",       color: "#7dd3fc" },
      { name: "Objectif budgété",  color: "#c4b5fd" },
    ]},
    { key: "prix",        label: "Prix",          active: 0, options: [
      { name: "Spot Belpex",       color: "#fbbf24" },
      { name: "Spot EPEX FR",      color: "#f59e0b" },
    ]},
    { key: "debit",       label: "Hydro · débit", active: 0, options: [
      { name: "Débit · Dordogne",  color: "#a3e635" },
      { name: "Débit · affluent",  color: "#65a30d" },
    ]},
  ];
  function buildLegende() {
    const body = document.getElementById("legende-body");
    if (!body) return;
    body.innerHTML = LEGENDE_SLOTS.map((slot, i) => {
      const active = slot.options[slot.active];
      return `<div class="legende-row">
        <span class="legende-slot-label">${slot.label}</span>
        <button class="legende-arrow" onclick="cycleSlot(${i}, -1)" aria-label="Précédent"><i data-lucide="chevron-left"></i></button>
        <span class="legende-active">
          <span class="legende-swatch" style="background:${active.color}"></span>
          <span class="legende-name" id="legende-active-${i}">${active.name}</span>
        </span>
        <button class="legende-arrow" onclick="cycleSlot(${i}, 1)"  aria-label="Suivant"><i data-lucide="chevron-right"></i></button>
      </div>`;
    }).join("");
    document.getElementById("legende-count").textContent = `${LEGENDE_SLOTS.length} indicateurs`;
    initIcons();
  }
  function toggleLegende() {
    const el = document.getElementById("legende");
    const open = el.dataset.open === "true";
    el.dataset.open = open ? "false" : "true";
    el.querySelector(".legende-head").setAttribute("aria-expanded", open ? "false" : "true");
  }
  function cycleSlot(slotIdx, delta) {
    const slot = LEGENDE_SLOTS[slotIdx];
    slot.active = (slot.active + delta + slot.options.length) % slot.options.length;
    const active = slot.options[slot.active];
    const nameEl = document.getElementById(`legende-active-${slotIdx}`);
    if (nameEl) nameEl.textContent = active.name;
    const swatch = nameEl?.previousElementSibling;
    if (swatch) swatch.style.background = active.color;
  }
  document.addEventListener("DOMContentLoaded", () => setTimeout(buildLegende, 0));

  let rightAxis = "prix";
  function toggleRightAxis() {
    rightAxis = rightAxis === "prix" ? "debit" : "prix";
    document.getElementById("right-axis-label").textContent = rightAxis === "prix" ? "Prix spot (€/MWh)" : "Débit (m³/s)";
  }
</script>
</body>
</html>
